name: Build OmniRoute Android Phone App

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/android-phone-app
    paths:
      - mobile/android/**
      - .github/workflows/android-phone-build.yml

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniRoute-Mobile-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
