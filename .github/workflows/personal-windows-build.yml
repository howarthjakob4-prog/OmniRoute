name: Personal OmniRoute Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - release/v3.8.51
    paths:
      - .github/workflows/personal-windows-build.yml

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true

      - name: Build web bundle
        run: npm run build
        env:
          JWT_SECRET: personal-build-secret-with-sufficient-length-for-validation
          NODE_OPTIONS: --max_old_space_size=6144
          OMNIROUTE_USE_TURBOPACK: "0"

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true

      - name: Build Windows installer and portable app
        working-directory: electron
        run: npm run build:win
        env:
          GH_TOKEN: ""

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: OmniRoute-3.8.51-Windows
          path: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.blockmap
            electron/dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 30
